# Exclusiones de CyberAware que se cargan ANTES de las reglas OWASP CRS.
# Identificadores 1000-1999 reservados para estas exclusiones.

# 1. Inicio de sesión (usuarios y superusuarios): el campo de contraseña no se analiza,
#    para que no provoque bloqueos ni aparezca en los mensajes de las reglas.
SecRule REQUEST_FILENAME "@rx ^/api/collections/(users|_superusers)/auth-with-password$" \
    "id:1000,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password"

# 2. Alta y cambio de contraseña de cuentas desde el panel de administración.
SecRule REQUEST_FILENAME "@rx ^/api/collections/(users|_superusers)/records" \
    "id:1001,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:passwordConfirm,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.passwordConfirm"

# 3. Falsos positivos encontrados en modo detección.
#    Plantilla (sustituir RUTA, ID_REGLA y CAMPO; documentar cada exclusión en CHANGELOG.md):
# SecRule REQUEST_FILENAME "@beginsWith RUTA" \
#     "id:1100,phase:1,pass,nolog,ctl:ruleRemoveTargetById=ID_REGLA;ARGS:CAMPO"
